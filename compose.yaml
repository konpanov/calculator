version: "3.8"
services:
  calc-backend-dev:
    build:
      context: calc-backend
    hostname: calc-backend
    networks:
      - calc-network
    ports:
      - 9090:9090
    volumes:
      - ./calc-backend/:/app
      - go-modules:/go/pkg/mod
  calc-frontend-dev:
    build:
      context: calc-frontend
    networks:
      - calc-network
    ports:
      - 80:80
    volumes:
      - ./calc-frontend/:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - BACKEND_URL=http://calc-backend:9090
volumes:
  go-modules:
networks:
  calc-network:
    driver: bridge
